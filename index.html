<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/insperjr.png" />
    <!--
      `maximum-scale=1` + `user-scalable=no`: dar zoom out no celular desmonta a
      organização das telas (a sidebar, as tabelas e os boards são pensados para
      caber na largura da viewport, não para serem vistos de longe). O Safari do
      iOS ignora `user-scalable=no` desde o iOS 10, então a trava de verdade lá é
      a de `utils/travarZoom.ts` — esta meta cobre Android e desktop.

      A contrapartida é séria e foi aceita conscientemente: travar zoom fere a
      WCAG 1.4.4. O que compensa é o resto não depender de zoom para ser lido —
      nenhuma tela pode estourar a viewport, e todo campo tem 16px em mobile
      (`index.css`), senão o iOS amplia sozinho e a pessoa fica presa ampliada.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <!--
      App instalável (PWA): o manifest diz nome, ícones e "standalone" (abre
      sem a barra do navegador). O iOS não lê os ícones do manifest pra tela
      de início, daí o apple-touch-icon; e só trata como app (inclusive pra
      receber push, iOS 16.4+) o que foi adicionado à Tela de Início.
      Barra de status "default": o layout não reserva a área do relógio
      (nenhum env(safe-area-inset-*) no CSS), então o conteúdo não pode ir
      por baixo dela.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="application-name" content="ATLAS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ATLAS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ATLAS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
